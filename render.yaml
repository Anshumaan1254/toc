# Render Blueprint for the Python API (render.com -> New -> Blueprint -> pick this repo).
# The website itself is deployed on Vercel (see frontend/vercel.json), which forwards /api, /docs and
# /openapi.json to this service, so the browser only ever talks to one domain.
services:
  - type: web
    name: toc-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
