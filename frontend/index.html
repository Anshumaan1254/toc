<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Automata Lab: ten regular languages, DFAs and NFAs, Hopcroft minimization, L*, RPNI and EDSM versus logistic regression, decision trees, random forests and stacking." />
    <meta name="theme-color" content="#0a1a2f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Automata Lab</title>
    <script>
      // Apply the stored theme before first paint (avoids a flash of the wrong theme).
      try {
        var t = localStorage.getItem("toc-theme");
        if (t === "light") { document.documentElement.classList.remove("dark"); document.documentElement.dataset.theme = "light"; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
